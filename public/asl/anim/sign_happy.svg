<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<defs>
  <linearGradient id="skinG" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#f5d0b0"/>
    <stop offset="1" stop-color="#d9a878"/>
  </linearGradient>
  
</defs>
<rect width="100%" height="100%" fill="#0b1220"/>

<g opacity="0.6">
  <ellipse cx="160" cy="170" rx="90" ry="55" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="175" text-anchor="middle" fill="#94a3b8" font-size="12">chest</text>
</g>
<g transform="translate(160 170)">
  <g>
    <g transform="rotate(-90)"><ellipse cx="-30" cy="14" rx="10" ry="16" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.5" transform="rotate(-25 -30 14)"/><rect x="-26" y="-10" width="52" height="60" rx="18" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.5"/><rect x="-20" y="-46" width="9" height="40" rx="5" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.2"/><rect x="-9" y="-46" width="9" height="40" rx="5" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.2"/><rect x="2" y="-46" width="9" height="40" rx="5" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.2"/><rect x="13" y="-46" width="9" height="40" rx="5" fill="url(#skinG)" stroke="#d9a878" stroke-width="1.2"/></g>
    <animateTransform attributeName="transform" type="translate"
      values="0,30; 0,-20; 0,30" dur="1.4s" repeatCount="indefinite"/>
  </g>
</g>
<g transform="translate(120 100)" opacity="0.9">
  <circle r="4" fill="#fde047">
    <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</g>
<g transform="translate(200 110)" opacity="0.9">
  <circle r="3" fill="#fde047">
    <animate attributeName="opacity" values="0;1;0" begin="0.3s" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</g>
<text x="160" y="225" text-anchor="middle" fill="#cbd5e1" font-size="14" font-family="system-ui">brush up ↑</text>

</svg>